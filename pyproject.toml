[project]
name = "api-security-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evangelin Paul", email = "Evangelin.paul@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langgraph>=1.2.15",
    "openai>=3.26.1",
    "openapi-spec-validator>=0.9.0",
    "prance>=26.7.19.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api-security-system = "api_security_system:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
