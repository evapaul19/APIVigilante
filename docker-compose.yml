services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: api_security
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: api_security
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_security"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pg_data: